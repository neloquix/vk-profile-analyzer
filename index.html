<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0,
    shrink-to-fit=no, user-scalable=no, viewport-fit=cover"
  >

  <title>VK Profile Analyzer</title>

  <script src="https://unpkg.com/@vkontakte/vk-bridge/dist/browser.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f2f3f5;
      color: #111;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
    }

    h1 {
      font-size: 28px;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #777;
      margin-bottom: 24px;
    }

    input {
      width: 100%;
      padding: 15px;
      border: 1px solid #ccc;
      border-radius: 12px;
      font-size: 16px;
      margin-bottom: 12px;
      background: white;
    }

    button {
      width: 100%;
      padding: 15px;
      border: 0;
      border-radius: 12px;
      background: #447bba;
      color: white;
      font-size: 16px;
      font-weight: 600;
    }

    button:disabled {
      opacity: 0.6;
    }

    #status {
      margin-top: 16px;
      color: #666;
      word-break: break-word;
    }

    .error {
      color: #d33 !important;
    }

    .profile {
      display: none;
      margin-top: 24px;
      padding: 20px;
      background: white;
      border-radius: 16px;
    }

    .avatar {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      object-fit: cover;
      margin-bottom: 15px;
    }

    .name {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 10px;
    }

    .info {
      color: #555;
      line-height: 1.7;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>VK Profile Analyzer</h1>

  <div class="subtitle">
    анализ публичной информации профиля VK
  </div>

  <input
    id="profileUrl"
    type="text"
    placeholder="вставь ссылку на профиль VK"
    value="https://vk.ru/id802548516"
  >

  <button id="analyzeButton">
    анализировать профиль
  </button>

  <div id="status">
    подключение к VK...
  </div>

  <div id="profile" class="profile">

    <img id="avatar" class="avatar" src="" alt="">

    <div id="name" class="name"></div>

    <div id="info" class="info"></div>

  </div>

</div>

<script>

const APP_ID = 54790628
const API_VERSION = "5.199"

let accessToken = null
let vkReady = false

function setStatus(text, error = false) {
  const status = document.getElementById("status")

  status.textContent = text
  status.className = error ? "error" : ""
}

function getUserId(value) {

  value = value.trim()

  const match = value.match(
    /(?:vk\.com|vk\.ru)\/id(\d+)/i
  )

  if (match) {
    return match[1]
  }

  const directId = value.match(/^\d+$/)

  if (directId) {
    return directId[0]
  }

  return value
}

async function initVK() {

  try {

    await vkBridge.send("VKWebAppInit")

    vkReady = true

    setStatus("VK Bridge работает")

  } catch (error) {

    console.error(error)

    setStatus(
      "ошибка запуска VK: " +
      JSON.stringify(error),
      true
    )

  }
}

async function getToken() {

  if (accessToken) {
    return accessToken
  }

  setStatus("запрашиваю доступ к VK API...")

  try {

    const result = await vkBridge.send(
      "VKWebAppGetAuthToken",
      {
        app_id: APP_ID,
        scope: ""
      }
    )

    accessToken = result.access_token

    if (!accessToken) {
      throw new Error("VK не вернул access token")
    }

    return accessToken

  } catch (error) {

    console.error("AUTH ERROR:", error)

    throw new Error(
      "ошибка авторизации: " +
      JSON.stringify(error)
    )

  }
}
async function showWall(userId) {

  try {

    const result =
      await loadWall(
        userId,
        accessToken
      )

    console.log(
      "СТЕНА ПРОФИЛЯ:",
      result
    )

    if (
      result &&
      result.response &&
      result.response.items
    ) {

      console.log(
        "ПУБЛИКАЦИИ:",
        result.response.items
      )

      alert(
        "стена получена\n" +
        "публикаций: " +
        result.response.items.length
      )

    } else {

      alert(
        "VK не вернул публикации\n\n" +
        JSON.stringify(result)
      )
    }

  } catch (error) {

    console.error(
      "WALL ERROR:",
      error
    )

    alert(
      "ошибка стены:\n" +
      error.message
    )
  }
}
async function analyzeProfile() {

  const button =
    document.getElementById("analyzeButton")

  button.disabled = true

  document.getElementById("profile").style.display =
    "none"

  try {

    if (!vkReady) {
      throw new Error("VK Bridge еще не готов")
    }

    const userId =
      getUserId(
        document.getElementById("profileUrl").value
      )

    if (!userId) {
      throw new Error("не указана ссылка на профиль")
    }

    const token = await getToken()

    setStatus("получаю информацию о профиле...")

    const result = await vkBridge.send(
      "VKWebAppCallAPIMethod",
      {
        method: "users.get",

        params: {
          user_ids: userId,

          fields: [
            "photo_200",
            "city",
            "country",
            "bdate",
            "sex",
            "status",
            "about",
            "activities",
            "interests",
            "books",
            "movies",
            "music",
            "games",
            "site",
            "followers_count",
            "verified",
            "last_seen",
            "occupation",
            "relation"
          ].join(","),

          access_token: token,

          v: API_VERSION
        }
      }
    )

    console.log("VK RESPONSE:", result)

    if (
      !result ||
      !result.response ||
      !result.response.length
    ) {

      throw new Error(
        "VK не вернул данные пользователя: " +
        JSON.stringify(result)
      )
    }

    const user = result.response[0]
  }
}
await showWall(
  user.id
)
    document.getElementById("avatar").src =
      user.photo_200 || ""

    document.getElementById("name").textContent =
      `${user.first_name || ""} ${user.last_name || ""}`.trim()

    const information = []

    information.push(`VK ID: ${user.id}`)

    if (user.screen_name) {
      information.push(
        `адрес: vk.com/${user.screen_name}`
      )
    }

    if (user.city?.title) {
      information.push(
        `город: ${user.city.title}`
      )
    }

    if (user.country?.title) {
      information.push(
        `страна: ${user.country.title}`
      )
    }

    if (user.bdate) {
      information.push(
        `дата рождения: ${user.bdate}`
      )
    }

    if (user.status) {
      information.push(
        `статус: ${user.status}`
      )
    }

    if (user.followers_count != null) {
      information.push(
        `подписчики: ${user.followers_count}`
      )
    }

    if (user.interests) {
      information.push(
        `интересы: ${user.interests}`
      )
    }

    if (user.activities) {
      information.push(
        `деятельность: ${user.activities}`
      )
    }

    if (user.music) {
      information.push(
        `музыка: ${user.music}`
      )
    }

    if (user.movies) {
      information.push(
        `фильмы: ${user.movies}`
      )
    }

    if (user.books) {
      information.push(
        `книги: ${user.books}`
      )
    }

    if (user.games) {
      information.push(
        `игры: ${user.games}`
      )
    }

    if (user.occupation?.name) {
      information.push(
        `работа: ${user.occupation.name}`
      )
    }

    document.getElementById("info").innerHTML =
      information
        .map(item => `<div>${item}</div>`)
        .join("")

    document.getElementById("profile").style.display =
      "block"

    setStatus("профиль найден")

  } catch (error) {

    console.error("PROFILE ERROR:", error)

    setStatus(
      error.message ||
      JSON.stringify(error),
      true
    )

  } finally {

    button.disabled = false

  }
}

document
  .getElementById("analyzeButton")
  .addEventListener(
    "click",
    analyzeProfile
  )

initVK()

</script>

<script src="./wall.js?v=2"></script>

</body>
</html>
