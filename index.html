<!DOCTYPE html>
<html lang="ru">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0,
    shrink-to-fit=no, user-scalable=no, viewport-fit=cover"
  >

  <title>VK Profile Analyzer</title>

  <script src="https://unpkg.com/@vkontakte/vk-bridge/dist/browser.min.js"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      background: #f2f3f5;
      color: #111;
    }

    .container {
      max-width: 650px;
      margin: 0 auto;
    }

    h1 {
      font-size: 28px;
      margin: 0 0 8px;
    }

    .subtitle {
      color: #777;
      margin-bottom: 24px;
    }

    input {
      width: 100%;

      padding: 15px;

      border: 1px solid #ccc;
      border-radius: 12px;

      font-size: 16px;

      margin-bottom: 12px;

      background: white;
    }

    button {
      width: 100%;

      padding: 15px;

      border: 0;
      border-radius: 12px;

      background: #447bba;
      color: white;

      font-size: 16px;
      font-weight: 600;
    }

    button:disabled {
      opacity: 0.6;
    }

    #status {
      margin-top: 16px;

      color: #666;

      word-break: break-word;
    }

    .error {
      color: #d33 !important;
    }

    .profile {
      display: none;

      margin-top: 24px;

      padding: 20px;

      background: white;

      border-radius: 16px;
    }

    .avatar {
      width: 96px;
      height: 96px;

      border-radius: 50%;

      object-fit: cover;

      margin-bottom: 15px;
    }

    .name {
      font-size: 24px;

      font-weight: 700;

      margin-bottom: 10px;
    }

    .info {
      color: #555;

      line-height: 1.7;
    }

    .section {
      display: none;

      margin-top: 24px;
    }

    .section-title {
      font-size: 22px;

      font-weight: 700;

      margin-bottom: 12px;
    }

    .post {
      background: white;

      border-radius: 16px;

      padding: 18px;

      margin-bottom: 14px;
    }

    .post-date {
      color: #888;

      font-size: 13px;

      margin-bottom: 10px;
    }

    .post-text {
      white-space: pre-wrap;

      word-break: break-word;

      line-height: 1.5;

      margin-bottom: 14px;
    }

    .post-stats {
      color: #777;

      font-size: 14px;

      margin-top: 12px;
    }

    .post-link {
      display: block;

      margin-top: 12px;

      color: #447bba;

      text-decoration: none;

      word-break: break-all;
    }

    .attachment {
      margin-top: 12px;

      padding: 10px;

      background: #f2f3f5;

      border-radius: 10px;

      font-size: 14px;
    }

    .attachment img {
      width: 100%;

      max-height: 500px;

      object-fit: contain;

      border-radius: 10px;

      display: block;
    }

    .empty {
      background: white;

      border-radius: 16px;

      padding: 18px;

      color: #777;
    }

    .load-more {
      margin-top: 4px;

      margin-bottom: 30px;
    }

  </style>

</head>


<body>


<div class="container">


  <h1>
    VK Profile Analyzer
  </h1>


  <div class="subtitle">
    анализ публичной информации профиля VK
  </div>


  <input
    id="profileUrl"
    type="text"
    placeholder="вставь ссылку на профиль VK"
    value="https://vk.ru/id802548516"
  >


  <button id="analyzeButton">
    анализировать профиль
  </button>


  <div id="status">
    подключение к VK...
  </div>


  <div
    id="profile"
    class="profile"
  >

    <img
      id="avatar"
      class="avatar"
      src=""
      alt=""
    >


    <div
      id="name"
      class="name"
    ></div>


    <div
      id="info"
      class="info"
    ></div>

  </div>


  <div
    id="wallSection"
    class="section"
  >

    <div class="section-title">
      стена
    </div>


    <div id="wall"></div>


    <button
      id="loadMoreButton"
      class="load-more"
      style="display:none"
    >
      загрузить еще
    </button>

  </div>


</div>


<script>


/* =========================
   ОСНОВНЫЕ НАСТРОЙКИ
========================= */


const APP_ID = 54790628

const API_VERSION = "5.199"


let accessToken = null

let vkReady = false

let currentUserId = null

let wallOffset = 0

let wallFinished = false

let wallLoading = false



/* =========================
   СТАТУС
========================= */


function setStatus(
  text,
  error = false
) {

  const status =
    document.getElementById(
      "status"
    )


  status.textContent =
    text


  status.className =
    error
      ? "error"
      : ""

}



/* =========================
   ПОЛУЧЕНИЕ ID
========================= */


function getUserId(
  value
) {

  value =
    value.trim()


  const match =
    value.match(
      /(?:vk\.com|vk\.ru)\/id(\d+)/i
    )


  if (match) {

    return match[1]

  }


  const directId =
    value.match(
      /^\d+$/
    )


  if (directId) {

    return directId[0]

  }


  return value

}



/* =========================
   ЗАПУСК VK BRIDGE
========================= */


async function initVK() {

  try {

    await vkBridge.send(
      "VKWebAppInit"
    )


    vkReady = true


    setStatus(
      "VK Bridge работает"
    )


  } catch (error) {

    console.error(
      "VK INIT ERROR:",
      error
    )


    setStatus(
      "ошибка запуска VK: " +
      JSON.stringify(error),
      true
    )

  }

}



/* =========================
   АВТОРИЗАЦИЯ
========================= */


async function getToken() {

  if (accessToken) {

    return accessToken

  }


  setStatus(
    "запрашиваю доступ к VK API..."
  )


  try {

    const result =
      await vkBridge.send(
        "VKWebAppGetAuthToken",
        {
          app_id: APP_ID,

          scope: ""
        }
      )


    accessToken =
      result.access_token


    if (!accessToken) {

      throw new Error(
        "VK не вернул access token"
      )

    }


    return accessToken


  } catch (error) {

    console.error(
      "AUTH ERROR:",
      error
    )


    throw new Error(
      "ошибка авторизации: " +
      JSON.stringify(error)
    )

  }

}



/* =========================
   ОБЩИЙ ВЫЗОВ VK API
========================= */


async function callVK(
  method,
  params = {}
) {

  const token =
    await getToken()


  const result =
    await vkBridge.send(
      "VKWebAppCallAPIMethod",
      {

        method: method,

        params: {

          ...params,

          access_token:
            token,

          v:
            API_VERSION

        }

      }
    )


  console.log(
    "VK API:",
    method,
    result
  )


  if (
    result &&
    result.error
  ) {

    throw new Error(
      `VK API ${method}: ` +
      JSON.stringify(
        result.error
      )
    )

  }


  return result

}



/* =========================
   ФОРМАТ ДАТЫ
========================= */


function formatDate(
  timestamp
) {

  if (!timestamp) {

    return ""

  }


  const date =
    new Date(
      timestamp * 1000
    )


  return date.toLocaleString(
    "ru-RU",
    {
      day: "2-digit",

      month: "2-digit",

      year: "numeric",

      hour: "2-digit",

      minute: "2-digit"
    }
  )

}



/* =========================
   ВЛОЖЕНИЯ
========================= */


function renderAttachment(
  attachment
) {

  const container =
    document.createElement(
      "div"
    )


  container.className =
    "attachment"


  if (!attachment) {

    return container

  }


  /* ФОТО */

  if (
    attachment.type === "photo" &&
    attachment.photo
  ) {

    const photo =
      attachment.photo


    const image =
      document.createElement(
        "img"
      )


    const sizes =
      photo.sizes || []


    if (sizes.length) {

      image.src =
        sizes[
          sizes.length - 1
        ].url

    } else {

      image.src =
        photo.url || ""

    }


    image.alt =
      photo.text ||
      "фотография"


    container.appendChild(
      image
    )


    return container

  }


  /* ВИДЕО */

  if (
    attachment.type === "video" &&
    attachment.video
  ) {

    const video =
      attachment.video


    container.textContent =
      "видео: " +
      (
        video.title ||
        "без названия"
      )


    return container

  }


  /* АУДИО */

  if (
    attachment.type === "audio" &&
    attachment.audio
  ) {

    const audio =
      attachment.audio


    container.textContent =
      "аудио: " +
      (
        audio.artist ||
        ""
      ) +
      " - " +
      (
        audio.title ||
        ""
      )


    return container

  }


  /* ДОКУМЕНТ */

  if (
    attachment.type === "doc" &&
    attachment.doc
  ) {

    const doc =
      attachment.doc


    container.textContent =
      "документ: " +
      (
        doc.title ||
        "без названия"
      )


    return container

  }


  /* ССЫЛКА */

  if (
    attachment.type === "link" &&
    attachment.link
  ) {

    const link =
      attachment.link


    const title =
      link.title ||
      link.url ||
      "ссылка"


    container.textContent =
      "ссылка: " +
      title


    if (link.url) {

      const a =
        document.createElement(
          "a"
        )


      a.href =
        link.url


      a.target =
        "_blank"


      a.rel =
        "noopener noreferrer"


      a.textContent =
        link.url


      container.appendChild(
        a
      )

    }


    return container

  }


  container.textContent =
    "вложение: " +
    (
      attachment.type ||
      "неизвестно"
    )


  return container

}



/* =========================
   ОТОБРАЖЕНИЕ ПОСТА
========================= */


function renderPost(
  post
) {

  const article =
    document.createElement(
      "article"
    )


  article.className =
    "post"


  /* ДАТА */

  const date =
    document.createElement(
      "div"
    )


  date.className =
    "post-date"


  date.textContent =
    formatDate(
      post.date
    )


  article.appendChild(
    date
  )


  /* ТЕКСТ */

  if (post.text) {

    const text =
      document.createElement(
        "div"
      )


    text.className =
      "post-text"


    text.textContent =
      post.text


    article.appendChild(
      text
    )

  }


  /* ВЛОЖЕНИЯ */

  if (
    post.attachments &&
    post.attachments.length
  ) {

    post.attachments.forEach(
      attachment => {

        article.appendChild(
          renderAttachment(
            attachment
          )
        )

      }
    )

  }


  /* РЕПОСТ */

  if (
    post.copy_history &&
    post.copy_history.length
  ) {

    const repost =
      document.createElement(
        "div"
      )


    repost.className =
      "attachment"


    repost.textContent =
      "репост"


    article.appendChild(
      repost
    )

  }


  /* СТАТИСТИКА */

  const statsParts = []


  if (
    post.likes &&
    post.likes.count != null
  ) {

    statsParts.push(
      "лайки: " +
      post.likes.count
    )

  }


  if (
    post.comments &&
    post.comments.count != null
  ) {

    statsParts.push(
      "комментарии: " +
      post.comments.count
    )

  }


  if (
    post.reposts &&
    post.reposts.count != null
  ) {

    statsParts.push(
      "репосты: " +
      post.reposts.count
    )

  }


  if (
    post.views &&
    post.views.count != null
  ) {

    statsParts.push(
      "просмотры: " +
      post.views.count
    )

  }


  if (statsParts.length) {

    const stats =
      document.createElement(
        "div"
      )


    stats.className =
      "post-stats"


    stats.textContent =
      statsParts.join(
        " · "
      )


    article.appendChild(
      stats
    )

  }


  /* ССЫЛКА */

  if (post.id) {

    const link =
      document.createElement(
        "a"
      )


    link.className =
      "post-link"


    link.target =
      "_blank"


    link.rel =
      "noopener noreferrer"


    link.href =
      "https://vk.com/wall" +
      currentUserId +
      "_" +
      post.id


    link.textContent =
      "открыть публикацию VK"


    article.appendChild(
      link
    )

  }


  return article

}



/* =========================
   ЗАГРУЗКА СТЕНЫ
========================= */


async function loadWall(
  reset = false
) {

  if (wallLoading) {

    return

  }


  if (
    wallFinished &&
    !reset
  ) {

    return

  }


  wallLoading = true


  const wall =
    document.getElementById(
      "wall"
    )


  const loadMoreButton =
    document.getElementById(
      "loadMoreButton"
    )


  if (reset) {

    wallOffset = 0

    wallFinished = false

    wall.innerHTML = ""

    loadMoreButton.style.display =
      "none"

  }


  try {

    setStatus(
      reset
        ? "получаю стену профиля..."
        : "загружаю еще публикации..."
    )


    const result =
      await callVK(
        "wall.get",
        {

          owner_id:
            Number(
              currentUserId
            ),

          count:
            10,

          offset:
            wallOffset,

          filter:
            "owner"

        }
      )


    console.log(
      "WALL RESPONSE:",
      result
    )


    if (
      !result ||
      !result.response
    ) {

      throw new Error(
        "VK не вернул стену: " +
        JSON.stringify(
          result
        )
      )

    }


    const response =
      result.response


    const posts =
      response.items || []


    if (!posts.length) {

      wallFinished = true


      if (
        wallOffset === 0
      ) {

        const empty =
          document.createElement(
            "div"
          )


        empty.className =
          "empty"


        empty.textContent =
          "публичных публикаций не найдено"


        wall.appendChild(
          empty
        )

      }


      loadMoreButton.style.display =
        "none"


      setStatus(
        "профиль найден"
      )


      return

    }


    posts.forEach(
      post => {

        wall.appendChild(
          renderPost(
            post
          )
        )

      }
    )


    wallOffset +=
      posts.length


    if (
      posts.length < 10 ||
      wallOffset >= response.count
    ) {

      wallFinished = true


      loadMoreButton.style.display =
        "none"

    } else {

      loadMoreButton.style.display =
        "block"

    }


    setStatus(
      "профиль найден"
    )


  } catch (error) {

    console.error(
      "WALL ERROR:",
      error
    )


    const errorBlock =
      document.createElement(
        "div"
      )


    errorBlock.className =
      "empty error"


    errorBlock.textContent =
      "не удалось получить стену: " +
      error.message


    wall.appendChild(
      errorBlock
    )


    loadMoreButton.style.display =
      "none"


    setStatus(
      "профиль найден"
    )


  } finally {

    wallLoading = false

  }

}



/* =========================
   АНАЛИЗ ПРОФИЛЯ
========================= */


async function analyzeProfile() {

  const button =
    document.getElementById(
      "analyzeButton"
    )


  button.disabled = true


  document.getElementById(
    "profile"
  ).style.display =
    "none"


  document.getElementById(
    "wallSection"
  ).style.display =
    "none"


  try {

    if (!vkReady) {

      throw new Error(
        "VK Bridge еще не готов"
      )

    }


    const userId =
      getUserId(
        document.getElementById(
          "profileUrl"
        ).value
      )


    if (!userId) {

      throw new Error(
        "не указана ссылка на профиль"
      )

    }


    currentUserId =
      userId


    /* ПОЛУЧАЕМ ПРОФИЛЬ */

    const result =
      await callVK(
        "users.get",
        {

          user_ids:
            userId,

          fields: [
            "photo_200",
            "city",
            "country",
            "bdate",
            "sex",
            "status",
            "about",
            "activities",
            "interests",
            "books",
            "movies",
            "music",
            "games",
            "site",
            "followers_count",
            "verified",
            "last_seen",
            "occupation",
            "relation"
          ].join(",")

        }
      )


    console.log(
      "PROFILE RESPONSE:",
      result
    )


    if (
      !result ||
      !result.response ||
      !result.response.length
    ) {

      throw new Error(
        "VK не вернул данные пользователя: " +
        JSON.stringify(
          result
        )
      )

    }


    const user =
      result.response[0]


    /* АВАТАР */

    document.getElementById(
      "avatar"
    ).src =
      user.photo_200 || ""


    /* ИМЯ */

    document.getElementById(
      "name"
    ).textContent =
      (
        `${user.first_name || ""} ` +
        `${user.last_name || ""}`
      ).trim()


    /* ИНФОРМАЦИЯ */

    const information = []


    information.push(
      "VK ID: " +
      user.id
    )


    if (
      user.screen_name
    ) {

      information.push(
        "адрес: vk.com/" +
        user.screen_name
      )

    }


    if (
      user.city &&
      user.city.title
    ) {

      information.push(
        "город: " +
        user.city.title
      )

    }


    if (
      user.country &&
      user.country.title
    ) {

      information.push(
        "страна: " +
        user.country.title
      )

    }


    if (
      user.bdate
    ) {

      information.push(
        "дата рождения: " +
        user.bdate
      )

    }


    if (
      user.status
    ) {

      information.push(
        "статус: " +
        user.status
      )

    }


    if (
      user.followers_count != null
    ) {

      information.push(
        "подписчики: " +
        user.followers_count
      )

    }


    if (
      user.interests
    ) {

      information.push(
        "интересы: " +
        user.interests
      )

    }


    if (
      user.activities
    ) {

      information.push(
        "деятельность: " +
        user.activities
      )

    }


    if (
      user.music
    ) {

      information.push(
        "музыка: " +
        user.music
      )

    }


    if (
      user.movies
    ) {

      information.push(
        "фильмы: " +
        user.movies
      )

    }


    if (
      user.books
    ) {

      information.push(
        "книги: " +
        user.books
      )

    }


    if (
      user.games
    ) {

      information.push(
        "игры: " +
        user.games
      )

    }


    if (
      user.occupation &&
      user.occupation.name
    ) {

      information.push(
        "работа: " +
        user.occupation.name
      )

    }


    document.getElementById(
      "info"
    ).innerHTML =
      information
        .map(
          item =>
            "<div>" +
            item +
            "</div>"
        )
        .join("")


    /* ПОКАЗЫВАЕМ ПРОФИЛЬ */

    document.getElementById(
      "profile"
    ).style.display =
      "block"


    /* ПОКАЗЫВАЕМ СТЕНУ */

    document.getElementById(
      "wallSection"
    ).style.display =
      "block"


    /* ЗАГРУЖАЕМ СТЕНУ */

    await loadWall(
      true
    )


  } catch (error) {

    console.error(
      "PROFILE ERROR:",
      error
    )


    setStatus(
      error.message ||
      JSON.stringify(
        error
      ),
      true
    )

  } finally {

    button.disabled = false

  }

}



/* =========================
   КНОПКИ
========================= */


document
  .getElementById(
    "analyzeButton"
  )
  .addEventListener(
    "click",
    analyzeProfile
  )


document
  .getElementById(
    "loadMoreButton"
  )
  .addEventListener(
    "click",
    () => {

      loadWall(
        false
      )

    }
  )



/* =========================
   ЗАПУСК
========================= */


initVK()


</script>


</body>

</html>
